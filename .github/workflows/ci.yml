name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validation & Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://barberkece_dev:barberkece_dev@localhost:5432/barberkece_dev"
      TEST_DATABASE_URL: "postgresql://barberkece_dev:barberkece_dev@localhost:5432/barberkece_test"
      APP_URL: "http://localhost:3000"
    steps:
      - name: Start PostgreSQL Service
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE ROLE barberkece_dev WITH LOGIN SUPERUSER PASSWORD 'barberkece_dev';"
          sudo -u postgres psql -c "CREATE DATABASE barberkece_dev OWNER barberkece_dev;"
          sudo -u postgres psql -c "CREATE DATABASE barberkece_test OWNER barberkece_dev;"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting
        run: pnpm format:check

      - name: Run linter
        run: pnpm --recursive run lint

      - name: Build packages and applications
        run: pnpm --recursive run --if-present build

      - name: Run typecheck
        run: pnpm --recursive run --if-present typecheck

      - name: Initialize Database Schema
        run: pnpm db:migrate

      - name: Initialize Test Database
        run: node tooling/scripts/migrate-test-db.mjs

      - name: Run unit tests
        run: pnpm test

      - name: Install Playwright Chromium browser & OS dependencies
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Run Playwright E2E smoke tests
        run: pnpm test:e2e
        env:
          CI: "true"

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
