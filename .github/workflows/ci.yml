name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validation & Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://barberkece_dev:barberkece_dev@localhost:5432/barberkece_dev"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: barberkece_dev
          POSTGRES_PASSWORD: barberkece_dev
          POSTGRES_DB: barberkece_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting
        run: pnpm format:check

      - name: Run linter
        run: pnpm --recursive run lint

      - name: Build packages and applications
        run: pnpm --recursive run --if-present build

      - name: Run typecheck
        run: pnpm --recursive run --if-present typecheck

      - name: Initialize Database Schema
        run: pnpm db:migrate

      - name: Run unit tests
        run: pnpm test

      - name: Install Playwright Chromium browser & OS dependencies
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Run Playwright E2E smoke tests
        run: pnpm test:e2e
        env:
          CI: "true"

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
